# The four gates, enforced.
#
# `pnpm lint && pnpm typecheck && pnpm test && pnpm build` is the standing rule
# in CLAUDE.md, and nothing enforced it — it ran when somebody remembered. Every
# bug found by a person clicking this week passed all four locally, so this is
# not a claim that CI would have caught them; it is the floor beneath the tests
# that DO exist, so a branch cannot regress them unnoticed.
name: CI

on:
  push:
    branches: [main, staging, v2]
  pull_request:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          # Node 24: the suite runs on the built-in test runner with native
          # type stripping, so the version is load-bearing rather than taste.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ordered cheapest-first so a broken branch fails fast.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # The build must not need real secrets. These are placeholders that
          # let Next prerender; anything that genuinely requires a live service
          # belongs behind a runtime read, not a build-time one.
          NEXT_PUBLIC_PRIVY_APP_ID: ci-placeholder
          WSAPI_BASE_URL: http://localhost:8080

  # `check:public-routes` is deliberately NOT here: it needs a live backend, and
  # a gate that cannot run is a gate everybody learns to ignore. Its offline
  # counterpart (lib/api/public-routes.test.ts) runs above with the rest.
